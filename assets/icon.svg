<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89b4fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#74c7ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" />

  <!-- 手掌轮廓 -->
  <g transform="translate(128, 128) scale(0.8)">
    <!-- 手掌 -->
    <path d="M-20,40 C-20,40 -30,20 -30,0 C-30,-10 -25,-15 -20,-15 C-15,-15 -10,-10 -10,0 L-10,-30 C-10,-40 -5,-45 0,-45 C5,-45 10,-40 10,-30 L10,0 C10,-10 15,-15 20,-15 C25,-15 30,-10 30,0 C30,10 25,20 20,30 L20,0 C20,-10 25,-15 30,-15 C35,-15 40,-10 40,0 C40,10 35,25 30,40 L30,50 C30,60 20,70 10,70 L-10,70 C-20,70 -30,60 -30,50 Z"
          fill="url(#hand)" stroke="#e0e0e0" stroke-width="2"/>

    <!-- 手指 -->
    <path d="M-10,-30 C-10,-30 -15,-50 -10,-60 C-5,-70 5,-70 10,-60 C15,-50 10,-30 10,-30"
          fill="url(#hand)" stroke="#e0e0e0" stroke-width="2"/>

    <!-- 拇指 -->
    <path d="M-30,0 C-30,0 -45,-10 -50,-5 C-55,0 -50,10 -40,15 C-30,20 -25,15 -25,10"
          fill="url(#hand)" stroke="#e0e0e0" stroke-width="2"/>

    <!-- 手腕 -->
    <rect x="-25" y="50" width="50" height="20" rx="5" fill="url(#hand)" stroke="#e0e0e0" stroke-width="2"/>
  </g>

  <!-- 光标 -->
  <g transform="translate(160, 80) rotate(45)">
    <polygon points="0,0 8,20 12,12 20,8" fill="#f38ba8" stroke="#1e1e2e" stroke-width="1"/>
  </g>

  <!-- 检测点 -->
  <circle cx="80" cy="90" r="4" fill="#a6e3a1" opacity="0.8"/>
  <circle cx="90" cy="80" r="3" fill="#a6e3a1" opacity="0.6"/>
  <circle cx="85" cy="85" r="3.5" fill="#a6e3a1" opacity="0.7"/>

  <!-- 连接线 -->
  <line x1="80" y1="90" x2="90" y2="80" stroke="#a6e3a1" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="80" x2="85" y2="85" stroke="#a6e3a1" stroke-width="1" opacity="0.5"/>
  <line x1="85" y1="85" x2="80" y2="90" stroke="#a6e3a1" stroke-width="1" opacity="0.5"/>
</svg>
